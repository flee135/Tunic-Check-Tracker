name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build exe
        run: pyinstaller --onefile --windowed --name TunicCheckTracker --add-data "locations.json;." tracker.py

      - name: Zip release
        run: |
          $zip = "TunicCheckTracker-${{ github.ref_name }}.zip"
          New-Item -ItemType Directory release\TunicCheckTracker
          Copy-Item dist\TunicCheckTracker.exe, LICENSE, THIRD_PARTY_NOTICES.md, README.md release\TunicCheckTracker
          Compress-Archive -Path release\TunicCheckTracker -DestinationPath $zip
          "ZIP=$zip" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" "$env:ZIP" --title "${{ github.ref_name }}" --generate-notes
